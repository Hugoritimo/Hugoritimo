<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-label="Victor Hugo — Desenvolvedor Full Stack em São Luís, MA">
  <style>
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; }
    .sans { font-family: Geist, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .display { font-family: "Bricolage Grotesque", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; }
    .d4 { animation-delay: .6s; } .d5 { animation-delay: .8s; } .d6 { animation-delay: 1s; }
    .blink { animation: blink 1.1s steps(1, end) infinite; animation-delay: 1.2s; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .grow { transform-origin: 32px 0; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#29241B"/>
    </pattern>
  </defs>

  <rect width="840" height="430" fill="#0B0A08"/>
  <rect width="840" height="430" fill="url(#dots)"/>

  <!-- barra superior -->
  <g class="rise d1">
    <rect x="32" y="22" width="26" height="26" fill="#FFB000"/>
    <text x="45" y="39.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#0B0A08" letter-spacing="0">VH</text>
    <text x="70" y="39" class="mono" font-size="11" fill="#A39882">VICTOR HUGO</text>
    <text x="808" y="39" text-anchor="end" class="mono" font-size="11" fill="#6F6656">GITHUB.COM/HUGORITIMO</text>
  </g>

  <!-- linha de metadados -->
  <rect class="grow" x="32" y="72" width="776" height="1" fill="#29241B"/>
  <g class="rise d2">
    <text x="32" y="94" class="mono" font-size="10" fill="#6F6656">FUNÇÃO</text>
    <text x="32" y="112" class="mono" font-size="11" fill="#EFE8D8">DESENVOLVEDOR FULL STACK</text>
    <text x="300" y="94" class="mono" font-size="10" fill="#6F6656">BASE</text>
    <text x="300" y="112" class="mono" font-size="11" fill="#EFE8D8">SÃO LUÍS, MA</text>
    <text x="568" y="94" class="mono" font-size="10" fill="#6F6656">STATUS</text>
    <rect class="pulse" x="568" y="104.5" width="6" height="6" fill="#FFB000"/>
    <text x="582" y="112" class="mono" font-size="11" fill="#EFE8D8">ACEITANDO PROJETOS</text>
  </g>

  <!-- nome -->
  <text class="display rise d3" x="28" y="222" font-size="108" fill="#EFE8D8" textLength="300" lengthAdjust="spacingAndGlyphs">Victor</text>
  <text class="display rise d4" x="28" y="318" font-size="108" fill="#EFE8D8" textLength="262" lengthAdjust="spacingAndGlyphs">Hugo</text>
  <g class="rise d5"><rect class="blink" x="302" y="236" width="50" height="82" fill="#FFB000"/></g>

  <!-- apresentação -->
  <g class="rise d6">
    <text x="32" y="372" class="sans" font-size="16" fill="#A39882">Desenvolvo <tspan fill="#EFE8D8" font-weight="600">sistemas internos, automações e dashboards</tspan> para empresas</text>
    <text x="32" y="396" class="sans" font-size="16" fill="#A39882">que precisam tirar a operação das planilhas e ter controle real sobre seus processos.</text>
  </g>
</svg>
