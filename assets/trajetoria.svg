<svg xmlns="http://www.w3.org/2000/svg" width="840" height="456" viewBox="0 0 840 456" role="img" aria-label="03 — Trajetória: do suporte à arquitetura">
  <style>
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; }
    .sans { font-family: Geist, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .display { font-family: "Bricolage Grotesque", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: -.02em; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .9s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    .drop { transform-box: fill-box; transform-origin: top; transform: scaleY(0); animation: drop 1.4s cubic-bezier(.2,.7,.2,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .step { opacity: 0; animation: step 6s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes drop { to { transform: scaleY(1); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes step { 0% { opacity: 0; } 3% { opacity: 1; } 19% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; } }
  </style>
  <rect width="840" height="456" fill="#0B0A08"/>
  <g class="rise" style="animation-delay:0.1s">
    <text x="32" y="44" class="mono" font-size="11" fill="#FFB000">03</text>
    <rect class="grow" x="58" y="40" width="40" height="1" fill="#FFB000"/>
    <text x="110" y="44" class="mono" font-size="11" fill="#A39882">TRAJETÓRIA</text>
  </g>
  <g class="rise" style="animation-delay:0.25s">
    <text x="30" y="100" class="display" font-size="44" fill="#EFE8D8">Do suporte</text>
    <text x="30" y="148" class="display" font-size="44" fill="#FFB000">à arquitetura.</text>
  </g>

  <rect class="drop" x="214" y="192" width="1" height="194" fill="#3B3427"/>
  <g class="rise" style="animation-delay:0.5s">
    <text x="32" y="200" class="mono" font-size="10" fill="#EFE8D8">ABR 2026 — ATUAL</text>
    <rect x="32" y="212" width="52" height="18" fill="none" stroke="#FFB000"/>
    <text x="58" y="225" text-anchor="middle" class="mono" font-size="9" fill="#FFB000">ATUAL</text>
    <rect class="pulse" x="210" y="192" width="9" height="9" fill="#FFB000" stroke="#FFB000"/>
    <text x="244" y="202" class="sans" font-size="18" font-weight="700" fill="#EFE8D8">Analista de Suporte Pleno</text>
    <text x="244" y="224" class="mono" font-size="10" fill="#6F6656">PROJETA CONSULTORIA E SERVIÇOS</text>
    <text x="244" y="246" class="sans" font-size="13" fill="#A39882">Ecossistema de sistemas internos e automação de processos; arquitetura full stack.</text>
  </g>
  <g class="rise" style="animation-delay:0.7s">
    <text x="32" y="292" class="mono" font-size="10" fill="#6F6656">FEV 2024 — ABR 2026</text>

    <rect x="210" y="284" width="9" height="9" fill="#0B0A08" stroke="#3B3427"/>
    <text x="244" y="294" class="sans" font-size="18" font-weight="700" fill="#EFE8D8">Analista de Suporte Júnior</text>
    <text x="244" y="316" class="mono" font-size="10" fill="#6F6656">PROJETA CONSULTORIA E SERVIÇOS</text>
    <text x="244" y="338" class="sans" font-size="13" fill="#A39882">Automações em Python, soluções em Power Platform e sustentação de sistemas legados.</text>
  </g>
  <g class="rise" style="animation-delay:0.9s">
    <text x="32" y="384" class="mono" font-size="10" fill="#6F6656">ABR 2023 — NOV 2023</text>

    <rect x="210" y="376" width="9" height="9" fill="#0B0A08" stroke="#3B3427"/>
    <text x="244" y="386" class="sans" font-size="18" font-weight="700" fill="#EFE8D8">Estagiário de Suporte de TI</text>
    <text x="244" y="408" class="mono" font-size="10" fill="#6F6656">MARDISA MERCEDES-BENZ</text>
    <text x="244" y="430" class="sans" font-size="13" fill="#A39882">Suporte corporativo regional (MA, PA, PI) em infraestrutura, redes e ERPs industriais.</text>
  </g>
</svg>
