<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="05 — Contato: hugoritimo@gmail.com">
  <style>
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; }
    .sans { font-family: Geist, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .display { font-family: "Bricolage Grotesque", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: -.02em; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .9s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    .drop { transform-box: fill-box; transform-origin: top; transform: scaleY(0); animation: drop 1.4s cubic-bezier(.2,.7,.2,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .step { opacity: 0; animation: step 6s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes drop { to { transform: scaleY(1); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes step { 0% { opacity: 0; } 3% { opacity: 1; } 19% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; } }
  </style>
  <rect width="840" height="300" fill="#0B0A08"/>
  <g class="rise" style="animation-delay:0.1s">
    <text x="32" y="44" class="mono" font-size="11" fill="#FFB000">05</text>
    <rect class="grow" x="58" y="40" width="40" height="1" fill="#FFB000"/>
    <text x="110" y="44" class="mono" font-size="11" fill="#A39882">CONTATO</text>
  </g>
  <g class="rise" style="animation-delay:0.25s">
    <text x="30" y="100" class="display" font-size="44" fill="#EFE8D8">Tem um processo</text>
    <text x="30" y="148" class="display" font-size="44" fill="#FFB000">travando a sua equipe?</text>
  </g>

  <g class="rise" style="animation-delay:0.5s">
    <text x="32" y="210" class="mono" font-size="22" fill="#EFE8D8" letter-spacing="0" textLength="264" lengthAdjust="spacingAndGlyphs">hugoritimo@gmail.com</text>
    <rect class="blink" x="304" y="192" width="12" height="22" fill="#FFB000"/>
  </g>
  <g class="rise" style="animation-delay:0.7s">
    <rect x="32" y="248" width="776" height="1" fill="#29241B"/>
    <text x="32" y="274" class="mono" font-size="10" fill="#6F6656">© 2026 VICTOR HUGO SOUSA DA SILVA</text>
    <text x="808" y="274" text-anchor="end" class="mono" font-size="10" fill="#6F6656">SÃO LUÍS, MA · 02°31′S 44°18′W</text>
  </g>
</svg>
