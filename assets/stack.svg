<svg xmlns="http://www.w3.org/2000/svg" width="840" height="452" viewBox="0 0 840 452" role="img" aria-label="04 — Stack: código como ferramenta de operação">
  <style>
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; }
    .sans { font-family: Geist, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .display { font-family: "Bricolage Grotesque", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: -.02em; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .9s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    .drop { transform-box: fill-box; transform-origin: top; transform: scaleY(0); animation: drop 1.4s cubic-bezier(.2,.7,.2,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .step { opacity: 0; animation: step 6s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes drop { to { transform: scaleY(1); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes step { 0% { opacity: 0; } 3% { opacity: 1; } 19% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; } }
  </style>
  <rect width="840" height="452" fill="#0B0A08"/>
  <g class="rise" style="animation-delay:0.1s">
    <text x="32" y="44" class="mono" font-size="11" fill="#FFB000">04</text>
    <rect class="grow" x="58" y="40" width="40" height="1" fill="#FFB000"/>
    <text x="110" y="44" class="mono" font-size="11" fill="#A39882">STACK</text>
  </g>
  <g class="rise" style="animation-delay:0.25s">
    <text x="30" y="100" class="display" font-size="44" fill="#EFE8D8">Código como ferramenta</text>
    <text x="30" y="148" class="display" font-size="44" fill="#FFB000">de operação.</text>
  </g>

  <g class="rise" style="animation-delay:0.5s">
    <rect x="32" y="186" width="178" height="1" fill="#3B3427"/>
    <text x="32" y="210" class="mono" font-size="10" fill="#FFB000">BACKEND &amp; AUTOMAÇÃO</text>
    <text x="32" y="240" class="sans" font-size="15" fill="#EFE8D8">Node.js / NestJS</text>
    <text x="32" y="266" class="sans" font-size="15" fill="#EFE8D8">Python / FastAPI</text>
    <text x="32" y="292" class="sans" font-size="15" fill="#EFE8D8">Java / Spring Boot</text>
    <text x="32" y="318" class="sans" font-size="15" fill="#EFE8D8">SQL / PostgreSQL</text>
    <text x="32" y="344" class="sans" font-size="15" fill="#EFE8D8">Redis</text>
  </g>
  <g class="rise" style="animation-delay:0.62s">
    <rect x="226" y="186" width="178" height="1" fill="#3B3427"/>
    <text x="226" y="210" class="mono" font-size="10" fill="#FFB000">FRONTEND &amp; MOBILE</text>
    <text x="226" y="240" class="sans" font-size="15" fill="#EFE8D8">Next.js</text>
    <text x="226" y="266" class="sans" font-size="15" fill="#EFE8D8">React</text>
    <text x="226" y="292" class="sans" font-size="15" fill="#EFE8D8">TypeScript</text>
    <text x="226" y="318" class="sans" font-size="15" fill="#EFE8D8">Tailwind CSS</text>
    <text x="226" y="344" class="sans" font-size="15" fill="#EFE8D8">React Native</text>
  </g>
  <g class="rise" style="animation-delay:0.74s">
    <rect x="420" y="186" width="178" height="1" fill="#3B3427"/>
    <text x="420" y="210" class="mono" font-size="10" fill="#FFB000">INFRA &amp; DEVOPS</text>
    <text x="420" y="240" class="sans" font-size="15" fill="#EFE8D8">Docker</text>
    <text x="420" y="266" class="sans" font-size="15" fill="#EFE8D8">AWS</text>
    <text x="420" y="292" class="sans" font-size="15" fill="#EFE8D8">GitHub Actions</text>
    <text x="420" y="318" class="sans" font-size="15" fill="#EFE8D8">Supabase / Vercel</text>
    <text x="420" y="344" class="sans" font-size="15" fill="#EFE8D8">Redes / FortiGate</text>
  </g>
  <g class="rise" style="animation-delay:0.86s">
    <rect x="614" y="186" width="178" height="1" fill="#3B3427"/>
    <text x="614" y="210" class="mono" font-size="10" fill="#FFB000">PROCESSO</text>
    <text x="614" y="240" class="sans" font-size="15" fill="#EFE8D8">REST APIs</text>
    <text x="614" y="266" class="sans" font-size="15" fill="#EFE8D8">Clean Architecture</text>
    <text x="614" y="292" class="sans" font-size="15" fill="#EFE8D8">Scrum</text>
    <text x="614" y="318" class="sans" font-size="15" fill="#EFE8D8">Governança de TI</text>
  </g>
  <g class="rise" style="animation-delay:1s">
    <rect x="32" y="380" width="776" height="1" fill="#29241B"/>
    <text x="32" y="408" class="mono" font-size="10" fill="#6F6656">FORMAÇÃO</text>
    <text x="140" y="408" class="sans" font-size="13" fill="#EFE8D8">Bacharelado Interdisciplinar em Ciência e Tecnologia — UFMA <tspan fill="#FFB000" class="mono" font-size="10">CURSANDO</tspan></text>
    <text x="140" y="430" class="sans" font-size="13" fill="#EFE8D8">Técnico em Informática para Internet — IEMA <tspan fill="#6F6656" class="mono" font-size="10">CONCLUÍDO</tspan></text>
  </g>
</svg>
