    <text x="556" y="46" class="mono" font-size="9" fill="#6F6656">FLUXO DO DADO</text>
    <line x1="556" y1="86" x2="792" y2="86" stroke="#29241B"/>
    <text x="566" y="76" class="mono" font-size="10" fill="#6F6656">01</text>
    <text x="596" y="76" class="mono" font-size="11" fill="#A39882">CONTA</text>
    <g class="step" style="animation-delay:0s">
      <rect x="556" y="58" width="236" height="27" fill="#FFB000" fill-opacity=".1"/>
      <rect x="556" y="58" width="2" height="27" fill="#FFB000"/>
      <text x="566" y="76" class="mono" font-size="10" fill="#FFB000">01</text>
      <text x="596" y="76" class="mono" font-size="11" fill="#FFB000">CONTA</text>
      <text x="784" y="76" text-anchor="end" class="mono" font-size="10" fill="#FFB000">[01/05]</text>
