    <text x="566" y="140" class="mono" font-size="10" fill="#6F6656">03</text>
    <text x="596" y="140" class="mono" font-size="11" fill="#A39882">TIPO DE TRANSAÇÃO</text>
    <g class="step" style="animation-delay:2.4s">
      <rect x="556" y="122" width="236" height="27" fill="#FFB000" fill-opacity=".1"/>
      <rect x="556" y="122" width="2" height="27" fill="#FFB000"/>
      <text x="566" y="140" class="mono" font-size="10" fill="#FFB000">03</text>
      <text x="596" y="140" class="mono" font-size="11" fill="#FFB000">TIPO DE TRANSAÇÃO</text>
      <text x="784" y="140" text-anchor="end" class="mono" font-size="10" fill="#FFB000">[03/05]</text>
    </g>
    <line x1="556" y1="182" x2="792" y2="182" stroke="#29241B"/>
    <text x="566" y="172" class="mono" font-size="10" fill="#6F6656">04</text>
    <text x="596" y="172" class="mono" font-size="11" fill="#A39882">CONTRATO</text>
    <g class="step" style="animation-delay:3.5999999999999996s">
      <rect x="556" y="154" width="236" height="27" fill="#FFB000" fill-opacity=".1"/>
      <rect x="556" y="154" width="2" height="27" fill="#FFB000"/>
      <text x="566" y="172" class="mono" font-size="10" fill="#FFB000">04</text>
      <text x="596" y="172" class="mono" font-size="11" fill="#FFB000">CONTRATO</text>
      <text x="784" y="172" text-anchor="end" class="mono" font-size="10" fill="#FFB000">[04/05]</text>
    </g>
    <line x1="556" y1="214" x2="792" y2="214" stroke="#29241B"/>
    <text x="566" y="204" class="mono" font-size="10" fill="#6F6656">05</text>
    <text x="596" y="204" class="mono" font-size="11" fill="#A39882">CUSTEIO</text>
    <g class="step" style="animation-delay:4.8s">
