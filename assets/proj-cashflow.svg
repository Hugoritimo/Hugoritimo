    <line x1="556" y1="118" x2="792" y2="118" stroke="#29241B"/>
    <text x="566" y="108" class="mono" font-size="10" fill="#6F6656">02</text>
    <text x="596" y="108" class="mono" font-size="11" fill="#A39882">VALOR</text>
    <g class="step" style="animation-delay:1.2s">
      <rect x="556" y="90" width="236" height="27" fill="#FFB000" fill-opacity=".1"/>
      <rect x="556" y="90" width="2" height="27" fill="#FFB000"/>
      <text x="566" y="108" class="mono" font-size="10" fill="#FFB000">02</text>
