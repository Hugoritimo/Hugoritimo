<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-label="Cash Flow System — Fluxo de caixa para a operação nos EUA. Lançamentos guiados em etapas, livro-razão por conta bancária ou cartão e 17 relatórios gerenciais integrados.">
  <style>
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; }
    .sans { font-family: Geist, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .display { font-family: "Bricolage Grotesque", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: -.02em; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .9s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    .drop { transform-box: fill-box; transform-origin: top; transform: scaleY(0); animation: drop 1.4s cubic-bezier(.2,.7,.2,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .step { opacity: 0; animation: step 6s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes drop { to { transform: scaleY(1); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes step { 0% { opacity: 0; } 3% { opacity: 1; } 19% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; } }
  </style>
  <rect width="840" height="250" fill="#0B0A08"/>

  <rect x="0.5" y="0.5" width="839" height="249" fill="none" stroke="#29241B"/>
  <g class="rise" style="animation-delay:0.1s">
    <text x="32" y="44" class="mono" font-size="10" fill="#FFB000">/02 — FINANCEIRO · PROJETA USA</text>
    <text x="500" y="44" text-anchor="end" class="mono" font-size="10" fill="#6F6656">[02/03]</text>
  </g>
  <text class="rise display" style="animation-delay:0.2s" x="30" y="92" font-size="34" fill="#EFE8D8">Cash Flow System</text>
  <g class="rise sans" style="animation-delay:0.3s" font-size="14" fill="#A39882">
    <text x="32" y="126">Fluxo de caixa para a operação nos EUA. Lançamentos guiados em</text>
    <text x="32" y="147">etapas, livro-razão por conta bancária ou cartão e 17 relatórios</text>
    <text x="32" y="168">gerenciais integrados.</text>
  </g>
  <g class="rise mono" style="animation-delay:0.4s">
    <text x="32" y="204" font-size="10" fill="#6F6656">NEXT.JS / TYPESCRIPT / SUPABASE / POSTGRESQL</text>
    <text x="32" y="228" font-size="11" fill="#FFB000">VER REPOSITÓRIO →</text>
  </g>
  <g class="rise" style="animation-delay:0.3s">
