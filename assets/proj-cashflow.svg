      <text x="566" y="204" class="mono" font-size="10" fill="#FFB000">05</text>
      <text x="596" y="204" class="mono" font-size="11" fill="#FFB000">CUSTEIO</text>
      <text x="784" y="204" text-anchor="end" class="mono" font-size="10" fill="#FFB000">[05/05]</text>
    </g>
