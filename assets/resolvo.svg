<svg xmlns="http://www.w3.org/2000/svg" width="840" height="478" viewBox="0 0 840 478" role="img" aria-label="01 — O que eu resolvo: menos planilha, mais operação">
  <style>
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; }
    .sans { font-family: Geist, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .display { font-family: "Bricolage Grotesque", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: -.02em; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .9s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    .drop { transform-box: fill-box; transform-origin: top; transform: scaleY(0); animation: drop 1.4s cubic-bezier(.2,.7,.2,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .step { opacity: 0; animation: step 6s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes drop { to { transform: scaleY(1); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes step { 0% { opacity: 0; } 3% { opacity: 1; } 19% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; } }
  </style>
  <rect width="840" height="478" fill="#0B0A08"/>
  <g class="rise" style="animation-delay:0.1s">
    <text x="32" y="44" class="mono" font-size="11" fill="#FFB000">01</text>
    <rect class="grow" x="58" y="40" width="40" height="1" fill="#FFB000"/>
    <text x="110" y="44" class="mono" font-size="11" fill="#A39882">O QUE EU RESOLVO</text>
  </g>
  <g class="rise" style="animation-delay:0.25s">
    <text x="30" y="100" class="display" font-size="44" fill="#EFE8D8">Menos planilha,</text>
    <text x="30" y="148" class="display" font-size="44" fill="#FFB000">mais operação.</text>
  </g>
  <text class="rise sans" style="animation-delay:0.4s" x="32" y="182" font-size="14" fill="#A39882">Não começo pela tela. Começo pelo gargalo: onde a equipe perde tempo e onde falta controle.</text>
  <g fill="none" stroke="#29241B">
    <rect x="32" y="214" width="776" height="236"/>
    <line x1="290.6666666666667" y1="214" x2="290.6666666666667" y2="450"/>
    <line x1="549.3333333333334" y1="214" x2="549.3333333333334" y2="450"/>
    <line x1="32" y1="332" x2="808" y2="332"/>
  </g>
  <g class="rise" style="animation-delay:0.5s">
    <text x="52" y="244" class="mono" font-size="10" fill="#6F6656">01</text>
    <text x="52" y="270" class="sans" font-size="17" font-weight="700" fill="#EFE8D8">Processos manuais</text>
    <text x="52" y="294" class="sans" font-size="13" fill="#A39882">Rotinas repetitivas viram fluxos</text>
    <text x="52" y="312" class="sans" font-size="13" fill="#A39882">digitais com regras e rastreabilidade.</text>
  </g>
  <g class="rise" style="animation-delay:0.6s">
    <text x="310.6666666666667" y="244" class="mono" font-size="10" fill="#6F6656">02</text>
    <text x="310.6666666666667" y="270" class="sans" font-size="17" font-weight="700" fill="#EFE8D8">Planilhas sem controle</text>
    <text x="310.6666666666667" y="294" class="sans" font-size="13" fill="#A39882">Dados dispersos ganham cadastro,</text>
    <text x="310.6666666666667" y="312" class="sans" font-size="13" fill="#A39882">permissões e histórico de alterações.</text>
  </g>
  <g class="rise" style="animation-delay:0.7s">
    <text x="569.3333333333334" y="244" class="mono" font-size="10" fill="#6F6656">03</text>
    <text x="569.3333333333334" y="270" class="sans" font-size="17" font-weight="700" fill="#EFE8D8">Relatórios demorados</text>
    <text x="569.3333333333334" y="294" class="sans" font-size="13" fill="#A39882">Relatórios, PDFs e consolidações</text>
    <text x="569.3333333333334" y="312" class="sans" font-size="13" fill="#A39882">passam a ser gerados automaticamente.</text>
  </g>
  <g class="rise" style="animation-delay:0.8s">
    <text x="52" y="362" class="mono" font-size="10" fill="#6F6656">04</text>
    <text x="52" y="388" class="sans" font-size="17" font-weight="700" fill="#EFE8D8">Operação sem visibilidade</text>
    <text x="52" y="412" class="sans" font-size="13" fill="#A39882">Painéis de produtividade, status e</text>
    <text x="52" y="430" class="sans" font-size="13" fill="#A39882">financeiro sem esperar o fim do mês.</text>
  </g>
  <g class="rise" style="animation-delay:0.9s">
    <text x="310.6666666666667" y="362" class="mono" font-size="10" fill="#6F6656">05</text>
    <text x="310.6666666666667" y="388" class="sans" font-size="17" font-weight="700" fill="#EFE8D8">Fluxos sem dono</text>
    <text x="310.6666666666667" y="412" class="sans" font-size="13" fill="#A39882">Etapas, responsáveis e histórico para</text>
    <text x="310.6666666666667" y="430" class="sans" font-size="13" fill="#A39882">nenhuma solicitação se perder.</text>
  </g>
  <g class="rise" style="animation-delay:1s">
    <text x="569.3333333333334" y="362" class="mono" font-size="10" fill="#6F6656">06</text>
    <text x="569.3333333333334" y="388" class="sans" font-size="17" font-weight="700" fill="#EFE8D8">Sistemas desconectados</text>
    <text x="569.3333333333334" y="412" class="sans" font-size="13" fill="#A39882">Integração entre APIs, ERPs e CRMs</text>
    <text x="569.3333333333334" y="430" class="sans" font-size="13" fill="#A39882">para acabar com lançamento duplicado.</text>
  </g>
</svg>
